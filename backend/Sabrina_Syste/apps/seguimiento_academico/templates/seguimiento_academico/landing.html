{% load static %}
<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title }} — Sabrina Syste</title>
    <link rel="stylesheet" href="{% static 'seguimiento_academico/css/landing.css' %}" />
  </head>
  <body>
    <main class="wrap">
      <section class="card">
        <div class="logo">
          <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 6.7c-1.6-1.1-4.2-1.6-6.2-1.3-.6.1-1 .6-1 1.2v10.9c0 .7.6 1.2 1.3 1.1 1.9-.3 4.3.1 5.9 1.1" />
            <path d="M12 6.7c1.6-1.1 4.2-1.6 6.2-1.3.6.1 1 .6 1 1.2v10.9c0 .7-.6 1.2-1.3 1.1-1.9-.3-4.3.1-5.9 1.1" />
            <path d="M12 6.7v13" />
          </svg>
        </div>
        <h1 class="title">{{ title }}</h1>
        <p class="status">{{ status }}</p>

        <div class="buttons">
          <button class="btn primary" onclick="onTest('API de prueba')">Probar API</button>
          <button class="btn" onclick="onTest('Health check')">Health</button>
          <button class="btn" onclick="onTest('Consola')">Probar Backend</button>
        </div>

        <small class="note">Esta es una página de estado temporal y estética rosa pastel, ponganos 10 profe.</small>
      </section>
    </main>

    <script>
      function onTest(label) {
        alert(label + ' — backend corriendo');
      }
    </script>
  </body>
</html>
